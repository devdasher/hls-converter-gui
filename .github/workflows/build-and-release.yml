name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  # ==================================================================
  # Windows
  # ==================================================================
  build-windows:
    runs-on: windows-latest

    env:
      APP_NAME: HLSConverter
      STATUS: beta
      PYTHON_VERSION: '3.11'
      VERSION: ${{ github.ref_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install hls-converter-cli
          python -m pip install pyinstaller==6.15.0

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --name "${{ env.APP_NAME }}" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender --exclude-module PySide6.Qt3DInput --exclude-module PySide6.Qt3DLogic --exclude-module PySide6.Qt3DAnimation --exclude-module PySide6.Qt3DExtras --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtHelp --exclude-module PySide6.QtNetworkAuth --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtPositioning --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest --exclude-module PySide6.QtWebChannel --exclude-module PySide6.QtWebSockets --exclude-module PySide6.QtNfc --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtSensors --exclude-module PySide6.QtSpatialAudio --exclude-module PySide6.QtTextToSpeech --exclude-module PySide6.QtRemoteObjects --exclude-module PySide6.QtScxml --exclude-module PySide6.QtStateMachine --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtXml hls_converter_gui.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\${{ env.APP_NAME }}.exe")) {
            Write-Error "Executable not found: dist\${{ env.APP_NAME }}.exe"
            exit 1
          }

          Write-Host "Executable found:"
          Get-Item "dist\${{ env.APP_NAME }}.exe" | Select-Object Name, Length

      - name: Prepare staging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\staging | Out-Null
          Copy-Item README.md dist\staging\
          Copy-Item LICENSE dist\staging\

      - name: Rename executable and set outputs
        id: set_names
        shell: pwsh
        run: |
          $basename = "${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.STATUS }}-Windows-x64-Portable"
          $exe = "$basename.exe"
          Move-Item -Path "dist\${{ env.APP_NAME }}.exe" -Destination "dist\staging\$exe"
          $executable_path = "dist\staging\$exe"
          $zip_path = "dist\$basename.zip"
          $checksum_path = "dist\staging\$exe.sha256"
          echo "basename=$basename" >> $env:GITHUB_OUTPUT
          echo "executable=$executable_path" >> $env:GITHUB_OUTPUT
          echo "zipfile=$zip_path" >> $env:GITHUB_OUTPUT
          echo "checksum_file=$checksum_path" >> $env:GITHUB_OUTPUT

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $basename = "${{ steps.set_names.outputs.basename }}"
          Compress-Archive -Path dist\staging\* -DestinationPath "dist\$basename.zip"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $exe = "${{ steps.set_names.outputs.executable }}"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          "$hash  ${{ steps.set_names.outputs.basename }}.exe" | Out-File -FilePath "${{ steps.set_names.outputs.checksum_file }}" -Encoding ascii

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.set_names.outputs.executable }}
            ${{ steps.set_names.outputs.zipfile }}
            ${{ steps.set_names.outputs.checksum_file }}
          overwrite: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==================================================================
  # Linux
  # ==================================================================
  build-linux:
    runs-on: ubuntu-latest

    env:
      APP_NAME: HLSConverter
      STATUS: beta
      PYTHON_VERSION: '3.11'
      VERSION: ${{ github.ref_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install hls-converter-cli
          python -m pip install pyinstaller==6.15.0

      - name: Detect architecture
        id: arch
        run: |
          ARCH=$(uname -m)

          if [ "$ARCH" = "x86_64" ]; then
            ARCH="x64"
          fi

          if [ "$ARCH" = "aarch64" ]; then
            ARCH="arm64"
          fi

          echo "arch=$ARCH" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --strip --name "${{ env.APP_NAME }}" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender --exclude-module PySide6.Qt3DInput --exclude-module PySide6.Qt3DLogic --exclude-module PySide6.Qt3DAnimation --exclude-module PySide6.Qt3DExtras --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtHelp --exclude-module PySide6.QtNetworkAuth --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtPositioning --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest --exclude-module PySide6.QtWebChannel --exclude-module PySide6.QtWebSockets --exclude-module PySide6.QtNfc --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtSensors --exclude-module PySide6.QtSpatialAudio --exclude-module PySide6.QtTextToSpeech --exclude-module PySide6.QtRemoteObjects --exclude-module PySide6.QtScxml --exclude-module PySide6.QtStateMachine --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtXml hls_converter_gui.py

      - name: Verify executable exists
        run: |
          if [ ! -f "dist/${{ env.APP_NAME }}" ]; then
            echo "Executable not found: dist/${{ env.APP_NAME }}"
            exit 1
          fi

          echo "Executable found:"
          ls -lh "dist/${{ env.APP_NAME }}"

      - name: Prepare staging directory
        run: |
          mkdir -p dist/staging
          cp README.md dist/staging/
          cp LICENSE dist/staging/

      - name: Rename executable and set outputs
        id: set_names
        run: |
          BASENAME="${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.STATUS }}-Linux-${{ steps.arch.outputs.arch }}-Portable"
          mv "dist/${{ env.APP_NAME }}" "dist/staging/${BASENAME}"
          echo "basename=${BASENAME}" >> $GITHUB_OUTPUT
          echo "executable=dist/staging/${BASENAME}" >> $GITHUB_OUTPUT
          echo "zipfile=dist/${BASENAME}.zip" >> $GITHUB_OUTPUT
          echo "checksum_file=dist/staging/${BASENAME}.sha256" >> $GITHUB_OUTPUT

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Create ZIP archive
        run: |
          cd dist/staging
          zip -r "../${{ steps.set_names.outputs.basename }}.zip" .
          cd ../..

      - name: Generate SHA256 checksum
        run: |
          cd dist/staging
          sha256sum "${{ steps.set_names.outputs.basename }}" > "${{ steps.set_names.outputs.basename }}.sha256"
          cd ../..

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.set_names.outputs.executable }}
            ${{ steps.set_names.outputs.zipfile }}
            ${{ steps.set_names.outputs.checksum_file }}
          overwrite: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==================================================================
  # macOS
  # ==================================================================
  build-macos:
    runs-on: macos-latest

    env:
      APP_NAME: HLSConverter
      STATUS: beta
      PYTHON_VERSION: '3.11'
      VERSION: ${{ github.ref_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install hls-converter-cli
          python -m pip install pyinstaller==6.15.0

      - name: Detect architecture
        id: arch
        run: |
          ARCH=$(uname -m)

          if [ "$ARCH" = "x86_64" ]; then
            ARCH="x64"
          fi

          if [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi

          echo "arch=$ARCH" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed --clean --noconfirm --strip --name "${{ env.APP_NAME }}" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender --exclude-module PySide6.Qt3DInput --exclude-module PySide6.Qt3DLogic --exclude-module PySide6.Qt3DAnimation --exclude-module PySide6.Qt3DExtras --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtHelp --exclude-module PySide6.QtNetworkAuth --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtPositioning --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest --exclude-module PySide6.QtWebChannel --exclude-module PySide6.QtWebSockets --exclude-module PySide6.QtNfc --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtSensors --exclude-module PySide6.QtSpatialAudio --exclude-module PySide6.QtTextToSpeech --exclude-module PySide6.QtRemoteObjects --exclude-module PySide6.QtScxml --exclude-module PySide6.QtStateMachine --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtXml hls_converter_gui.py

      - name: Verify executable exists
        run: |
          if [ ! -f "dist/${{ env.APP_NAME }}" ]; then
            echo "Executable not found: dist/${{ env.APP_NAME }}"
            exit 1
          fi

          echo "Executable found:"
          ls -lh "dist/${{ env.APP_NAME }}"

      - name: Prepare staging directory
        run: |
          mkdir -p dist/staging
          cp README.md dist/staging/
          cp LICENSE dist/staging/

      - name: Rename executable and set outputs
        id: set_names
        run: |
          BASENAME="${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.STATUS }}-macOS-${{ steps.arch.outputs.arch }}-Portable"
          mv "dist/${{ env.APP_NAME }}" "dist/staging/${BASENAME}"
          echo "basename=${BASENAME}" >> $GITHUB_OUTPUT
          echo "executable=dist/staging/${BASENAME}" >> $GITHUB_OUTPUT
          echo "zipfile=dist/${BASENAME}.zip" >> $GITHUB_OUTPUT
          echo "checksum_file=dist/staging/${BASENAME}.sha256" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        run: |
          cd dist/staging
          zip -r "../${{ steps.set_names.outputs.basename }}.zip" .
          cd ../..

      - name: Generate SHA256 checksum
        run: |
          cd dist/staging
          shasum -a 256 "${{ steps.set_names.outputs.basename }}" > "${{ steps.set_names.outputs.basename }}.sha256"
          cd ../..

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.set_names.outputs.executable }}
            ${{ steps.set_names.outputs.zipfile }}
            ${{ steps.set_names.outputs.checksum_file }}
          overwrite: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

