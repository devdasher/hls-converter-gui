[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hls-converter-gui"
version = "0.7.0"
description = "PySide6 desktop GUI for the hls-converter-cli package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "devdasher" }]
keywords = ["hls", "ffmpeg", "gui", "pyside6", "video", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
]

dependencies = [
    "hls-converter-cli>=0.9.0,<1",
    "PySide6>=6.7",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/devdasher/hls-converter-gui"
Source   = "https://github.com/devdasher/hls-converter-gui"
Issues   = "https://github.com/devdasher/hls-converter-gui/issues"

[project.scripts]
hls-converter-gui = "hls_converter_gui:main"

[tool.setuptools]
py-modules = ["hls_converter_gui"]